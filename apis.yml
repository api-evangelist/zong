name: Zong
description: 'Zong was a mobile carrier-billing micropayments company that let consumers buy digital
  goods, apps, and content and charge them directly to their mobile phone bill, without entering credit-card
  details. Founded in 2008 (spun out of Echovox) and led by CEO David Marcus, Zong was backed by Matrix
  Partners and NewMargin Ventures and published a developer API for selling and delivering content to mobile
  customers worldwide. eBay acquired Zong in 2011 for roughly $240M and folded its technology into PayPal;
  the brand went offline around May 2015 and zong.com now redirects to PayPal. The company is defunct and
  operates no live API or developer platform today.'
